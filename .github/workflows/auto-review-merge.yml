# PRの自動レビュー＋自動マージ(呼び出し側)
# 本体は Nunifuchisaka/Enchanter の .github/workflows/claude-review-reusable.yml。
# 全リポジトリ共通の内容だが、このリポジトリは公開なので呼び出し先をコミットSHAで固定している。
# Enchanter側を更新したら、下の uses: のSHAも更新すること。
# 必要なシークレット: CLAUDE_CODE_OAUTH_TOKEN(または ANTHROPIC_API_KEY)

name: Auto review & merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'レビュー(＋マージ)するPR番号'
        required: true

concurrency:
  group: auto-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  auto-review:
    uses: Nunifuchisaka/Enchanter/.github/workflows/claude-review-reusable.yml@dc31c3240e877e52de556e36f5efcbd84362df9b # main (2026-11-18時点)
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number || inputs.pr_number) }}
    secrets: inherit
